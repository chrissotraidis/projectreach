name: HaloPad direct IPA private verification
on:
  push:
    branches: [codex/xbox-update-flow]
    paths: [.github/workflows/halopad-ipa-probe.yml]
permissions:
  contents: write
jobs:
  private-delivery:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retrieve a retained candidate and verify private delivery twice
        run: |
          python3 scripts/xbox/draft_release.py --download halopad-candidate-0.3.8-19 --out generated/probe-input
          python3 scripts/xbox/publish_ipa.py --candidate generated/probe-input/result.json --out generated/probe-release
          python3 scripts/xbox/publish_ipa.py --candidate generated/probe-input/result.json --out generated/probe-retry
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          a = json.loads(Path('generated/probe-release/publication.json').read_text())
          b = json.loads(Path('generated/probe-retry/publication.json').read_text())
          assert a == b and a['published'] is False and a['apple_services_used'] is False
          release = json.loads(subprocess.check_output(['gh','api',f'repos/chrissotraidis/projectreach/releases/{a["release_id"]}']))
          assert release['draft'] is True
          assert {x['name']: x['digest'] for x in release['assets']} == {k: 'sha256:'+v for k,v in a['assets'].items()}
          print('PASS: private direct IPA delivery, repeat receipt and GitHub asset hashes; no publishing.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: halopad-private-ipa-proof
          path: generated/probe-release/publication.json
          retention-days: 30
