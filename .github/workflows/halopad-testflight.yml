name: HaloPad TestFlight delivery
on:
  workflow_run:
    workflows: [HaloPad release build]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate:
        description: Existing private candidate tag (no rebuild)
        required: true
        type: string
      resume_uploaded:
        description: Resume this exact build already uploaded to App Store Connect
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: halopad-testflight
  cancel-in-progress: false
jobs:
  select:
    # Empty/unset channel disables delivery. No PR/fork/branch can use credentials.
    if: >-
      (vars.HALOPAD_TESTFLIGHT_CHANNEL == 'internal' || vars.HALOPAD_TESTFLIGHT_CHANNEL == 'external') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.candidate.outputs.ready }}
      tag: ${{ steps.candidate.outputs.tag }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Select a completed build or skip unchanged work
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate }}
        run: python3 scripts/xbox/select_delivery.py
  deliver:
    needs: select
    if: needs.select.outputs.ready == 'true'
    permissions:
      # Draft release assets require push access even for download-only requests.
      contents: write
    runs-on: macos-15
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      BUNDLE_GEMFILE: tools/testflight/Gemfile
      HALOPAD_TESTFLIGHT_CHANNEL: ${{ vars.HALOPAD_TESTFLIGHT_CHANNEL }}
      HALOPAD_TESTFLIGHT_GROUPS: ${{ vars.HALOPAD_TESTFLIGHT_GROUPS }}
      HALOPAD_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.HALOPAD_USES_NON_EXEMPT_ENCRYPTION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.3.9'
          bundler-cache: true
      - name: Retrieve the exact retained build
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.select.outputs.tag }}
          PRODUCER_COMMIT: ${{ needs.select.outputs.commit }}
        run: |
          python3 scripts/xbox/draft_release.py --download "$CANDIDATE_TAG" --out generated/testflight-input
          python3 - <<'PY'
          import json, os
          result = json.load(open('generated/testflight-input/result.json'))
          expected = os.environ.get('PRODUCER_COMMIT')
          if expected and result['source']['commit'] != expected:
              raise SystemExit('Retained candidate differs from the producing run')
          PY
      - name: Install temporary signing inputs
        env:
          HALOPAD_SIGNING_P12_BASE64: ${{ secrets.HALOPAD_SIGNING_P12_BASE64 }}
          HALOPAD_SIGNING_P12_PASSWORD: ${{ secrets.HALOPAD_SIGNING_P12_PASSWORD }}
          HALOPAD_PROFILE_BASE64: ${{ secrets.HALOPAD_PROFILE_BASE64 }}
          HALOPAD_API_KEY_BASE64: ${{ secrets.HALOPAD_API_KEY_BASE64 }}
        run: python3 scripts/xbox/ci_signing.py prepare
      - name: Export, verify and submit to TestFlight
        env:
          HALOPAD_SIGNING_IDENTITY: ${{ secrets.HALOPAD_SIGNING_IDENTITY }}
          HALOPAD_API_KEY_ID: ${{ secrets.HALOPAD_API_KEY_ID }}
          HALOPAD_API_ISSUER: ${{ secrets.HALOPAD_API_ISSUER }}
          RESUME_UPLOADED: ${{ inputs.resume_uploaded }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          mode=()
          if [ "$RESUME_UPLOADED" = true ]; then mode=(--resume-uploaded); fi
          python3 scripts/xbox/testflight.py --candidate generated/testflight-input/result.json \
            --out generated/testflight-delivery --profile "$HALOPAD_SIGNING_PROFILE" \
            --identity "$HALOPAD_SIGNING_IDENTITY" "${mode[@]}"
      - name: Remove temporary credentials
        if: always()
        run: python3 scripts/xbox/ci_signing.py cleanup
      - name: Save delivery receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: halopad-testflight-report-${{ github.run_id }}
          path: |
            generated/testflight-delivery/export/export-proof.json
            generated/testflight-delivery/testflight-request.json
            generated/testflight-delivery/testflight-submission.json
          if-no-files-found: ignore
          retention-days: 30
