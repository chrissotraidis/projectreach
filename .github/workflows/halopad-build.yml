name: HaloPad release build
on:
  push:
    branches: [main, codex/xbox-update-flow]
    paths: ['port/**', 'scripts/**', 'config/**', 'tests/**', 'assets/**', '.github/workflows/halopad-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: halopad-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HALOPAD_BUILD_JOBS: '3'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew install llvm lld cmake ninja sdl3
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
      - name: Build this release's fixed engine and audit both packages
        run: |
          python3 scripts/xbox/candidate.py --app-version 0.3.8 \
            --first-build "$((1000 + GITHUB_RUN_NUMBER))" \
            --record config/xbox-release.json > candidate-result.json
      - name: Stage installer source and app-update metadata
        run: |
          python3 scripts/xbox/update_source.py \
            --candidate generated/xbox-candidates/latest-built.json \
            --out generated/release-stage --tag v0.3.8
      - name: Save build report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halopad-build-report-${{ github.run_number }}
          path: |
            candidate-result.json
            generated/xbox-candidates/runs/*/result.json
            generated/xbox-candidates/runs/*/*.log
            generated/release-stage/halopad-update.json
          if-no-files-found: warn
          retention-days: 14
      # Binary upload/promotion stays off until exact-artifact distribution and
      # consumer signing are accepted. No signing key, game disc or player data
      # is needed by this hosted build. This is not a scheduled Codex agent.
