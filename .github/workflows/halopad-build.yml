name: HaloPad release build
on:
  push:
    branches: [main, codex/xbox-update-flow]
    paths: ['port/**', 'scripts/**', 'config/**', 'tests/**', 'assets/**', 'tools/**', '.github/workflows/halopad-build.yml', '.github/workflows/halopad-testflight.yml', '.github/workflows/halopad-ipa.yml']
  workflow_dispatch:
    inputs:
      engine:
        description: Engine selection (upstream is an experimental candidate)
        type: choice
        options: [release, upstream]
        default: release
  repository_dispatch:
    types: [opence-release]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: halopad-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  delivery-tests:
    if: github.event_name != 'schedule' || vars.HALOPAD_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: tools/testflight/Gemfile
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.3.9'
          bundler-cache: true
      - run: bundle exec ruby tools/testflight/test_delivery.rb
  select:
    # One-time opt-in stays off until a consumer delivery route is accepted.
    if: github.event_name != 'schedule' || vars.HALOPAD_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      # GitHub hides draft releases from read-only tokens, defeating deduplication.
      contents: write
    outputs:
      build: ${{ steps.engine.outputs.build }}
      record: ${{ steps.engine.outputs.record }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENGINE_CHANNEL: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && 'upstream' || inputs.engine || (github.ref == 'refs/heads/main' && 'upstream' || 'release') }}
      SKIP_RETAINED: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve engine once and skip completed upstream work
        id: engine
        run: |
          selection=()
          if [ "$SKIP_RETAINED" = true ]; then selection=(--skip-retained); fi
          python3 scripts/xbox/check_update.py --channel "$ENGINE_CHANNEL" \
            --app-version 0.3.8 "${selection[@]}" > selection.json
      - name: Save retained candidate selection for delivery retries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: halopad-selection-${{ github.run_number }}-${{ github.run_attempt }}
          path: selection.json
          retention-days: 14
  build:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HALOPAD_BUILD_JOBS: '3'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      ENGINE_RECORD: ${{ needs.select.outputs.record }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm lld cmake ninja sdl3
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
      - name: Check real keychain setup with disposable fixtures
        run: python3 tools/testflight/smoke_keychain.py
      - name: Build the selected engine and audit both packages
        run: |
          python3 -c 'import json,os,pathlib; pathlib.Path("selected-engine.json").write_text(json.dumps(json.loads(os.environ["ENGINE_RECORD"])))'
          python3 scripts/xbox/candidate.py --app-version 0.3.8 \
            --first-build "$((1000 + GITHUB_RUN_NUMBER))" \
            --record selected-engine.json > candidate-result.json
      - name: Stage installer source and app-update metadata
        run: |
          python3 scripts/xbox/update_source.py \
            --candidate generated/xbox-candidates/latest-built.json \
            --out generated/release-stage --tag "halopad-0.3.8-$((1000 + GITHUB_RUN_NUMBER))"
      - name: Retain exact candidate privately for signing
        # GITHUB_TOKEN cannot create a release targeting unmerged workflow changes.
        # Drafts become available only to repository writers, never the player feed.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/xbox/draft_release.py \
            --candidate generated/xbox-candidates/latest-built.json \
            --out generated/private-handoff > private-handoff.json
      - name: Save build report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halopad-build-report-${{ github.run_number }}
          path: |
            candidate-result.json
            private-handoff.json
            generated/xbox-candidates/runs/*/result.json
            generated/xbox-candidates/runs/*/xbox-release.json
            generated/xbox-candidates/runs/*/*.log
            generated/release-stage/halopad-update.json
          if-no-files-found: warn
          retention-days: 14
      # Public promotion stays off until distribution and consumer signing pass.
      # No signing key, game disc or player data is needed by this hosted build.
